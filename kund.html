<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Igelkott Kundshop</title><link rel="stylesheet" href="style.css"></head><body><main style="margin:0;width:100%;max-width:1100px;margin:auto"><header><div><h1>🦔 Igelkott</h1><p>Datorer, tillbehör och service</p></div><a class="secondary" href="index.html" style="text-decoration:none">Butikssystem</a></header><div class="card"><div class="toolbar"><input id="q" class="input search" placeholder="🔎 Sök produkter" oninput="render()"></div><div id="p" class="productgrid"></div></div><div class="card section"><h2>Varukorg</h2><div id="c" class="empty">Varukorgen är tom.</div></div></main><script>const d=JSON.parse(localStorage.getItem('igelkott_store_v1')||'null');let cart=[];const m=n=>Number(n).toLocaleString('sv-SE',{style:'currency',currency:'SEK',maximumFractionDigits:0});const e=s=>String(s??'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));function render(){if(!d){document.getElementById('p').innerHTML='<div class="empty">Öppna butikssystemet först.</div>';return}let q=document.getElementById('q').value.toLowerCase();document.getElementById('p').innerHTML=d.products.filter(x=>(x.name+' '+x.sku).toLowerCase().includes(q)).map(x=>`<div class="product"><h3>${e(x.name)}</h3><div class="muted">${e(x.cat)} • ${x.stock} st</div><div class="row"><span class="price">${m(x.price)}</span><button class="primary" onclick="add(${x.id})">Lägg i varukorg</button></div></div>`).join('');cartRender()}function add(id){let x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id,qty:1});cartRender()}function cartRender(){let z=document.getElementById('c');if(!cart.length){z.innerHTML='Varukorgen är tom.';return}let t=0;z.innerHTML=cart.map(x=>{let p=d.products.find(p=>p.id===x.id);t+=p.price*x.qty;return `<div class="cartrow"><span>${e(p.name)} × ${x.qty}</span><b>${m(p.price*x.qty)}</b></div>`}).join('')+`<div class="total"><span>Total</span><span>${m(t)}</span></div><button class="primary" style="width:100%;margin-top:12px" onclick="order()">Skicka DEMO-order</button>`}function order(){alert('DEMO-order skapad. Riktig orderhantering mellan enheter kräver backend/databas.');cart=[];cartRender()}render();</script></body></html>
