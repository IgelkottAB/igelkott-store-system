<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Igelkott Store – Butiksinloggning</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="center">
  <div class="card login">
    <h1>🦔 Igelkott Store</h1>
    <h2>Butiksinloggning</h2>
    <p class="muted">Endast personal/admin.</p>
    <form id="login" class="form">
      <input name="email" type="email" placeholder="E-post" required>
      <input name="password" type="password" placeholder="Lösenord" required>
      <button class="btn" type="submit">Logga in</button>
    </form>
    <p id="msg" class="msg"></p>
    <p class="small">Kund? <a href="kund.html">Gå till kundportalen</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
